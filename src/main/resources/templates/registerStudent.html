<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>受講生登録</title>
</head>
<body>
<h1>受講生登録</h1>
<!-- th:action...form入力されたら「/registerStudent」に飛ぶアクションを起こす。つまりPostMappingの方に飛ぶ -->
<!-- th:object...java側のaddattributeで付けた名前のstudentDetailを使用。-->
<!-- method...th:actionで飛ぶhttpメソッドのメソッド名を指定する。今回はpost。 -->
<form th:action="@{/registerStudent}" th:object="${studentDetail}" method="post">
  <!-- student 本体 -->
  <!-- th:field...入力されて取得したい値の箱を入れておく -->
  <div>
    <label for="studentName">名前:</label>
    <input type="text" id="studentName" th:field="*{student.studentName}" required/>
  </div>
  <div>
    <label for="furigana">フリガナ:</label>
    <input type="text" id="furigana" th:field="*{student.furigana}" required/>
  </div>
  <div>
    <label for="nickname">ニックネーム:</label>
    <input type="text" id="nickname" th:field="*{student.nickname}" required/>
  </div>
  <div>
    <label for="email">メールアドレス:</label>
    <input type="text" id="email" th:field="*{student.email}" required/>
  </div>
  <div>
    <label for="city">住所:</label>
    <input type="text" id="city" th:field="*{student.city}" required/>
  </div>
  <div>
    <label for="age">年齢:</label>
    <input type="number" id="age" th:field="*{student.age}" min="20" max="120"/>
  </div>
  <div>
    <label for="gender">性別</label>
    <input type="text" id="gender" th:field="*{student.gender}"/>
  </div>
  <div>
    <label for="remark">備考欄</label>
    <input type="text" id="remark" th:field="*{student.remark}"/>
  </div>

  <!-- courses リスト -->
  <div th:each="course, stat : *{studentCourse}">
    <label th:for="|studentCourse[${stat.index}].courseName|">受講コース名</label>
    <input type="text"
           th:field="*{studentCourse[__${stat.index}__].courseName}"
           placeholder="コース名"/>
  </div>
  <div>
    <button type="submit">登録</button>
  </div>
</form>
</body>
</html>
